name: Deploy Command Center

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'mcp_crm/**'
      - '.agent/**'
      - 'supabase/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_REQUIRE_AUTH: ${{ secrets.VITE_REQUIRE_AUTH }}
          VITE_FILE_SERVER_BASE_URL: ${{ secrets.VITE_FILE_SERVER_BASE_URL }}
          VITE_FILE_SERVER_API_KEY: ${{ secrets.VITE_FILE_SERVER_API_KEY }}
        run: npm run build

      - name: Deploy to whitepine via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: dist/
          remote_path: /home/deploy/websites/dashboard/
          remote_host: 5.78.128.255
          remote_user: deploy
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}
